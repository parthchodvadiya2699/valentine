<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Be My Valentine 💖</title>
<style>
    body {
        margin: 0;
        font-family: 'Comic Sans MS', cursive, sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        text-align: center;
    }

    .card {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        max-width: 400px;
        position: relative;
    }

    h1 {
        color: #ff4d6d;
        margin-bottom: 30px;
    }

    .buttons {
        position: relative;
        height: 120px;
    }

    button {
        padding: 12px 25px;
        font-size: 18px;
        border-radius: 30px;
        border: none;
        cursor: pointer;
        position: absolute;
        transition: all 0.2s ease;
    }

    #yesBtn {
        background-color: #ff4d6d;
        color: white;
        left: 50%;
        transform: translateX(-120%);
    }

    #noBtn {
        background-color: #666;
        color: white;
        left: 50%;
        transform: translateX(20%);
    }

    #result {
        display: none;
        margin-top: 20px;
    }

    #result img {
        width: 100%;
        border-radius: 15px;
        margin-top: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .hearts {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        overflow: hidden;
    }

    .heart {
        position: absolute;
        color: rgba(255, 77, 109, 0.7);
        animation: floatUp 5s linear infinite;
        font-size: 24px;
    }

    @keyframes floatUp {
        from { transform: translateY(100vh) scale(1); opacity: 1; }
        to { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }
</style>
</head>
<body>

<div class="hearts"></div>

<div class="card">
    <h1>Will you be my Valentine? 💘</h1>
    <div class="buttons">
        <button id="yesBtn">Yes 💖</button>
        <button id="noBtn">No 🙈</button>
    </div>

    <div id="result">
        <h2>YAY!!! 🎉💞</h2>
        <p>Congratulations, you're stuck with me now 😘</p>
        <img src="your-photo.jpg" alt="Us together">
    </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const result = document.getElementById("result");

// Move "No" button away from cursor
document.addEventListener("mousemove", (e) => {
    const rect = noBtn.getBoundingClientRect();
    const distance = Math.hypot(e.clientX - (rect.left + rect.width/2),
                                e.clientY - (rect.top + rect.height/2));

    if (distance < 100) {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
        noBtn.style.transform = "none";
    }
});

// When YES is clicked
yesBtn.addEventListener("click", () => {
    result.style.display = "block";
    yesBtn.style.display = "none";
    noBtn.style.display = "none";
    startHearts();
});

// Floating hearts animation
function startHearts() {
    const heartsContainer = document.querySelector(".hearts");
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 20) + "px";
        heartsContainer.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
    }, 300);
}
</script>

</body>
</html>
